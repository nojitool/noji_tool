<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="noindex,nofollow">
  <title>カメラご案内コンサル</title>
  <style>:root {
  --ink: #17211d;
  --muted: #66716c;
  --paper: #f7f5ef;
  --card: #fffefa;
  --line: #dedfd8;
  --green: #1f654d;
  --green-deep: #174c3b;
  --green-soft: #e8f1ec;
  --orange: #e56f3d;
  --shadow: 0 22px 70px rgba(25, 49, 39, 0.09);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Hiragino Sans", "Yu Gothic UI", "Yu Gothic", Meiryo, sans-serif; -webkit-font-smoothing: antialiased; }
button, input, textarea, select { font: inherit; }
button, a { -webkit-tap-highlight-color: transparent; }
button { color: inherit; }
.app-shell { min-height: 100vh; overflow: hidden; }
.page-wrap { width: min(1180px, calc(100% - 48px)); margin: 0 auto; }
.narrow-wrap { width: min(880px, calc(100% - 48px)); }

.topbar { min-height: 82px; padding: 14px max(24px, calc((100vw - 1180px) / 2)); display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(23, 33, 29, 0.1); background: rgba(247, 245, 239, 0.92); backdrop-filter: blur(16px); position: relative; z-index: 10; }
.brand-lockup { border: 0; background: transparent; display: flex; align-items: center; gap: 13px; padding: 0; cursor: pointer; text-align: left; }
.brand-lockup strong { display: block; font-family: Arial, sans-serif; font-size: 15px; letter-spacing: .13em; }
.brand-lockup small { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; letter-spacing: .04em; }
.lens-mark { width: 43px; height: 43px; border: 3px solid var(--green); border-radius: 50%; display: grid; place-items: center; position: relative; }
.lens-mark::before, .lens-mark::after { content: ""; position: absolute; inset: 5px; border: 1px solid rgba(31, 101, 77, .45); border-radius: 50%; }
.lens-mark::after { inset: 11px; background: var(--green); border: 0; }
.lens-mark span { position: absolute; width: 7px; height: 7px; border-radius: 50%; background: var(--orange); top: 3px; right: 2px; z-index: 2; }
.topbar-actions { display: flex; align-items: center; gap: 18px; }
.staff-badge { padding: 8px 12px; background: var(--green-soft); color: var(--green-deep); border-radius: 999px; font-size: 12px; font-weight: 700; }
.text-button, .back-link { border: 0; background: transparent; cursor: pointer; color: var(--muted); font-size: 13px; font-weight: 700; }
.text-button:hover, .back-link:hover { color: var(--green); }

.welcome-page { padding: 62px 0 36px; }
.hero-panel { min-height: 500px; display: grid; grid-template-columns: 1.05fr .95fr; background: var(--card); border: 1px solid var(--line); border-radius: 34px; overflow: hidden; box-shadow: var(--shadow); }
.hero-copy { padding: 70px 30px 62px 70px; position: relative; z-index: 2; }
.kicker { display: flex; align-items: center; gap: 10px; margin: 0 0 22px; color: var(--green); font-family: Arial, sans-serif; font-size: 11px; font-weight: 800; letter-spacing: .18em; }
.kicker span { width: 26px; height: 2px; background: var(--orange); }
.hero-copy h1 { margin: 0; font-size: clamp(44px, 5vw, 68px); line-height: 1.18; letter-spacing: -.06em; font-weight: 750; }
.hero-copy h1 em { color: var(--green); font-style: normal; }
.hero-description { max-width: 520px; margin: 25px 0 31px; color: var(--muted); font-size: 16px; line-height: 2; }
.primary-button { border: 0; min-height: 54px; padding: 0 25px; border-radius: 15px; background: var(--green); color: white; font-size: 14px; font-weight: 750; box-shadow: 0 12px 26px rgba(31, 101, 77, .2); cursor: pointer; display: inline-flex; justify-content: center; align-items: center; gap: 24px; transition: transform .2s ease, background .2s ease, box-shadow .2s ease; }
.primary-button:hover { background: var(--green-deep); transform: translateY(-2px); box-shadow: 0 15px 34px rgba(31, 101, 77, .25); }
.primary-button:disabled { opacity: .35; cursor: not-allowed; transform: none; box-shadow: none; }
.hero-button { min-width: 215px; }
.time-note { display: flex; align-items: center; gap: 10px; margin: 17px 0 0 2px; color: #7a847f; font-size: 11px; }
.time-note span { color: var(--orange); font-weight: 800; }
.time-note i { width: 3px; height: 3px; background: #aab0ad; border-radius: 50%; }

.hero-visual { position: relative; min-height: 500px; background: var(--green); overflow: hidden; }
.hero-visual::before { content: ""; position: absolute; width: 470px; height: 470px; border: 1px solid rgba(255,255,255,.11); border-radius: 50%; top: 15px; left: 12px; }
.hero-visual::after { content: ""; position: absolute; width: 330px; height: 330px; border: 1px solid rgba(255,255,255,.09); border-radius: 50%; top: 85px; left: 82px; }
.focus-corner { position: absolute; width: 70px; height: 70px; border-color: rgba(255,255,255,.55); z-index: 3; }
.corner-one { left: 45px; top: 40px; border-left: 2px solid; border-top: 2px solid; }
.corner-two { right: 45px; bottom: 40px; border-right: 2px solid; border-bottom: 2px solid; }
.camera-illustration { position: absolute; width: 360px; height: 245px; top: 50%; left: 50%; transform: translate(-50%, -48%) rotate(-4deg); z-index: 2; filter: drop-shadow(0 30px 40px rgba(7, 27, 20, .28)); }
.camera-top { position: absolute; left: 85px; top: 9px; width: 120px; height: 55px; background: #e9e8df; border-radius: 17px 17px 4px 4px; transform: skewX(-9deg); }
.camera-top::before { content: ""; position: absolute; width: 40px; height: 12px; border-radius: 8px; background: #282d2b; top: -7px; left: 19px; }
.camera-body { position: absolute; inset: 46px 12px 10px; border-radius: 32px 38px 35px 31px; background: linear-gradient(145deg, #393f3d, #151a18); border: 7px solid #e9e8df; }
.camera-grip { position: absolute; right: -8px; top: 26px; width: 72px; height: 140px; background: #242a27; border-radius: 27px 20px 34px 22px; box-shadow: inset 8px 0 12px rgba(255,255,255,.04); }
.camera-lens { position: absolute; width: 170px; height: 170px; left: 75px; top: 12px; border-radius: 50%; background: #1a201e; border: 12px solid #bcbdb7; box-shadow: inset 0 0 0 12px #343b38, inset 0 0 0 28px #111715; display: grid; place-items: center; }
.camera-lens::before { content: ""; position: absolute; inset: 43px; border-radius: 50%; background: radial-gradient(circle at 34% 30%, #547f76, #183930 28%, #080c0b 70%); }
.camera-lens span { position: absolute; width: 21px; height: 21px; border-radius: 50%; background: rgba(255,255,255,.27); top: 52px; left: 53px; z-index: 2; }
.camera-lens i { position: absolute; inset: 20px; border: 1px solid rgba(255,255,255,.14); border-radius: 50%; }
.floating-card { position: absolute; min-width: 133px; padding: 13px 16px; background: rgba(255,255,255,.94); box-shadow: 0 16px 36px rgba(5, 27, 19, .22); border-radius: 14px; display: flex; align-items: center; gap: 10px; z-index: 4; }
.floating-card b { color: var(--orange); font-family: Arial, sans-serif; font-size: 10px; }
.floating-card span { font-size: 11px; font-weight: 750; }
.card-one { left: 22px; bottom: 102px; transform: rotate(-3deg); }
.card-two { right: 24px; top: 93px; transform: rotate(3deg); }

.guide-strip { display: grid; grid-template-columns: repeat(4, 1fr); margin: 22px 10px 0; padding: 21px 0; border-bottom: 1px solid var(--line); }
.guide-strip article { display: flex; align-items: center; gap: 13px; padding: 0 22px; border-right: 1px solid var(--line); }
.guide-strip article:last-child { border-right: 0; }
.guide-strip article > span { color: var(--orange); font-family: Arial, sans-serif; font-size: 11px; font-weight: 800; }
.guide-strip strong, .guide-strip small { display: block; }
.guide-strip strong { font-size: 13px; }
.guide-strip small { margin-top: 4px; color: var(--muted); font-size: 10px; }
.data-note { margin: 18px 0 0; text-align: center; color: #8a928e; font-size: 11px; }

.consult-page { padding: 42px 0 90px; }
.progress-head { display: flex; align-items: center; justify-content: space-between; }
.back-link { display: flex; align-items: center; gap: 9px; padding: 8px 0; }
.progress-copy { font-family: Arial, sans-serif; color: var(--muted); }
.progress-copy b { color: var(--green); font-size: 22px; }
.progress-copy span { font-size: 12px; }
.progress-track { height: 4px; margin: 13px 0 36px; background: #dfe1dc; border-radius: 99px; overflow: hidden; }
.progress-track span { display: block; height: 100%; background: var(--orange); border-radius: inherit; transition: width .35s ease; }
.question-card { padding: 48px 58px 52px; background: var(--card); border: 1px solid var(--line); border-radius: 28px; box-shadow: var(--shadow); }
.question-eyebrow { margin: 0 0 14px; color: var(--green); font-family: Arial, sans-serif; font-size: 11px; font-weight: 800; letter-spacing: .12em; }
.question-card h2 { margin: 0; font-size: clamp(26px, 4vw, 40px); letter-spacing: -.04em; line-height: 1.35; }
.question-description { margin: 12px 0 31px; color: var(--muted); font-size: 13px; line-height: 1.8; }
.option-grid { display: grid; gap: 11px; }
.option-grid.compact-options { grid-template-columns: 1fr 1fr; }
.option-card { width: 100%; min-height: 76px; padding: 14px 18px; border: 1.5px solid var(--line); border-radius: 15px; background: white; text-align: left; display: flex; align-items: center; gap: 15px; cursor: pointer; transition: border .18s ease, background .18s ease, transform .18s ease; }
.option-card:hover:not(:disabled) { border-color: #8cb6a5; transform: translateX(2px); }
.option-card.selected { border-color: var(--green); background: var(--green-soft); box-shadow: inset 0 0 0 1px var(--green); }
.option-card:disabled { opacity: .42; cursor: not-allowed; }
.selection-dot { width: 25px; height: 25px; flex: 0 0 25px; border: 1.5px solid #bdc4c0; border-radius: 50%; display: grid; place-items: center; color: white; font-size: 12px; font-weight: 800; }
.selected .selection-dot { border-color: var(--green); background: var(--green); }
.option-copy strong, .option-copy small { display: block; }
.option-copy strong { font-size: 14px; }
.option-copy small { margin-top: 5px; color: var(--muted); font-size: 11px; }
.selection-count { margin: 12px 0 0; text-align: right; color: var(--muted); font-size: 11px; }
.next-button { width: 100%; margin-top: 28px; }

.results-page { padding: 52px 0 90px; }
.results-heading { display: flex; justify-content: space-between; align-items: end; gap: 24px; }
.results-heading h1 { margin: 0; font-size: clamp(31px, 4.5vw, 51px); letter-spacing: -.055em; }
.outline-button { min-height: 43px; padding: 0 18px; border: 1px solid #bfc4c0; border-radius: 12px; background: transparent; color: var(--muted); font-size: 12px; font-weight: 700; cursor: pointer; }
.outline-button:hover { border-color: var(--green); color: var(--green); }
.outline-button:disabled { opacity: .4; cursor: not-allowed; }
.answer-chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 22px 0 29px; }
.answer-chips span { padding: 7px 11px; border: 1px solid var(--line); border-radius: 999px; background: rgba(255,255,255,.55); color: var(--muted); font-size: 11px; }
.recommendation-card { display: grid; grid-template-columns: 1.25fr .75fr; background: var(--card); border: 1px solid var(--line); border-radius: 28px; overflow: hidden; box-shadow: var(--shadow); }
.recommendation-main { padding: 47px 52px 43px; }
.best-label { margin: 0 0 29px; color: var(--green); font-size: 11px; font-weight: 800; }
.best-label span { margin-right: 10px; padding: 6px 9px; border-radius: 6px; background: var(--orange); color: white; font-family: Arial, sans-serif; font-size: 9px; letter-spacing: .1em; }
.product-brand { margin: 0 0 4px; color: var(--muted); font-family: Arial, sans-serif; font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
.recommendation-main h2 { margin: 0; font-size: clamp(34px, 5vw, 58px); letter-spacing: -.055em; line-height: 1.15; }
.product-tagline { margin: 13px 0 20px; color: var(--green); font-size: 15px; font-weight: 700; }
.spec-chips { display: flex; flex-wrap: wrap; gap: 7px; }
.spec-chips span { padding: 6px 9px; background: #f0f1ed; border-radius: 6px; color: #5e6863; font-size: 10px; font-weight: 700; }
.reason-list { margin-top: 37px; padding-top: 27px; border-top: 1px solid var(--line); }
.reason-list h3 { margin: 0 0 17px; font-size: 13px; }
.reason-list > div { display: grid; grid-template-columns: 32px 1fr; align-items: start; gap: 12px; margin-top: 12px; }
.reason-list b { color: var(--orange); font-family: Arial, sans-serif; font-size: 10px; padding-top: 3px; }
.reason-list p { margin: 0; color: #4f5954; font-size: 13px; line-height: 1.8; }
.official-link { display: inline-flex; gap: 8px; align-items: center; margin-top: 24px; color: var(--green); font-size: 11px; font-weight: 800; text-decoration: none; }
.official-link:hover { text-decoration: underline; }
.talk-panel { padding: 44px 37px; background: var(--green); color: white; display: flex; flex-direction: column; }
.talk-label { margin: 0; color: #b9d2c8; font-family: Arial, sans-serif; font-size: 10px; font-weight: 800; letter-spacing: .14em; }
.talk-panel blockquote { margin: 25px 0 26px; font-size: 14px; line-height: 2.15; font-weight: 650; }
.copy-button { min-height: 43px; border: 1px solid rgba(255,255,255,.5); border-radius: 11px; background: transparent; color: white; font-size: 11px; font-weight: 800; cursor: pointer; }
.copy-button:hover { background: rgba(255,255,255,.1); }
.caution-box { margin-top: auto; padding: 18px; border-radius: 13px; background: rgba(10, 45, 32, .45); }
.caution-box strong { display: block; margin-bottom: 8px; color: #f4c3ad; font-size: 10px; }
.caution-box p { margin: 0; color: #d9e7e1; font-size: 10px; line-height: 1.8; }

.cost-option-section { margin-top: 42px; }
.cost-option-heading { display: flex; justify-content: space-between; align-items: end; gap: 24px; margin-bottom: 17px; }
.cost-option-heading p { margin: 0 0 7px; color: var(--orange); font-family: Arial, sans-serif; font-size: 9px; font-weight: 800; letter-spacing: .16em; }
.cost-option-heading h2 { margin: 0; font-size: 25px; }
.cost-option-heading > span { color: var(--muted); font-size: 10px; text-align: right; }
.cost-option-card { display: grid; grid-template-columns: 1.08fr .92fr; overflow: hidden; border: 1px solid #e2c7b7; border-radius: 23px; background: var(--card); box-shadow: 0 18px 48px rgba(58, 39, 29, .08); }
.cost-option-main { padding: 37px 42px 35px; }
.cost-option-label { margin: 0 0 24px; color: var(--green); font-size: 10px; font-weight: 800; }
.cost-option-label span { margin-right: 10px; padding: 6px 9px; border-radius: 6px; background: var(--orange); color: white; font-family: Arial, sans-serif; font-size: 8px; letter-spacing: .1em; }
.cost-option-main h3 { margin: 0; font-size: clamp(29px, 4vw, 43px); letter-spacing: -.045em; line-height: 1.18; }
.cost-option-tagline { margin: 11px 0 18px; color: var(--green); font-size: 13px; font-weight: 700; line-height: 1.7; }
.cost-keeps { margin-top: 28px; padding-top: 23px; border-top: 1px solid var(--line); }
.cost-keeps h4 { margin: 0 0 13px; font-size: 12px; }
.cost-keeps p { display: grid; grid-template-columns: 21px 1fr; gap: 9px; margin: 9px 0 0; color: #4f5954; font-size: 11px; line-height: 1.75; }
.cost-keeps p span { color: var(--green); font-weight: 900; }
.cost-changes { padding: 37px 36px 34px; background: #fff3ec; border-left: 1px solid #edd5c7; }
.cost-changes-label { margin: 0 0 9px; color: #a65f42; font-size: 9px; font-weight: 800; line-height: 1.7; }
.cost-changes h3 { margin: 0; font-size: 19px; }
.cost-change-list { margin-top: 24px; }
.cost-change-list > div { display: grid; grid-template-columns: 29px 1fr; gap: 11px; padding: 14px 0; border-top: 1px solid #ead1c3; }
.cost-change-list b { color: var(--orange); font-family: Arial, sans-serif; font-size: 9px; padding-top: 4px; }
.cost-change-list p { margin: 0; color: #5e5049; font-size: 11px; line-height: 1.85; }
.cost-note { margin: 20px 0 0; padding: 14px 15px; border-radius: 10px; background: rgba(255,255,255,.65); color: #806e64; font-size: 9px; line-height: 1.75; }
.cost-option-empty { padding: 28px 32px; border: 1px solid #e2c7b7; border-radius: 18px; background: #fff8f3; }
.cost-option-empty strong { display: block; color: var(--green-deep); font-size: 13px; }
.cost-option-empty p { margin: 8px 0 0; color: var(--muted); font-size: 10px; line-height: 1.8; }

.alternatives-section { margin-top: 52px; }
.section-title-row { display: flex; justify-content: space-between; align-items: end; margin-bottom: 17px; }
.section-title-row p { margin: 0 0 7px; color: var(--orange); font-family: Arial, sans-serif; font-size: 9px; font-weight: 800; letter-spacing: .16em; }
.section-title-row h2 { margin: 0; font-size: 23px; }
.section-title-row > span { color: var(--muted); font-size: 10px; }
.alternative-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.alternative-card { position: relative; min-height: 250px; padding: 28px 25px 23px; border: 1px solid var(--line); border-radius: 18px; background: var(--card); text-align: left; cursor: pointer; transition: transform .2s ease, border .2s ease, box-shadow .2s ease; }
.alternative-card:hover { transform: translateY(-4px); border-color: #98b9aa; box-shadow: 0 16px 35px rgba(25,49,39,.08); }
.alternative-card.active { border: 2px solid var(--green); background: var(--green-soft); }
.rank-number { position: absolute; top: 22px; right: 22px; color: #c7cbc8; font-family: Arial, sans-serif; font-size: 25px; font-weight: 800; }
.alternative-card > p { margin: 0 0 6px; color: var(--muted); font-family: Arial, sans-serif; font-size: 9px; font-weight: 800; letter-spacing: .12em; }
.alternative-card h3 { max-width: 85%; margin: 0; font-size: 20px; line-height: 1.3; }
.alternative-card > small { display: block; min-height: 48px; margin: 13px 0 15px; color: var(--muted); font-size: 10px; line-height: 1.7; }
.alternative-card > div { display: flex; flex-wrap: wrap; gap: 5px; }
.alternative-card > div span { padding: 5px 7px; background: white; border-radius: 5px; color: var(--muted); font-size: 9px; }
.alternative-card > b { display: block; margin-top: 20px; color: var(--green); font-size: 10px; }
.restart-panel { display: flex; align-items: center; justify-content: space-between; gap: 30px; margin-top: 42px; padding: 28px 32px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.restart-panel strong, .restart-panel span { display: block; }
.restart-panel strong { font-size: 14px; }
.restart-panel div > span { margin-top: 5px; color: var(--muted); font-size: 10px; }
footer { display: flex; align-items: center; justify-content: space-between; gap: 30px; padding: 23px max(24px, calc((100vw - 1180px) / 2)); border-top: 1px solid var(--line); color: #848c88; }
footer span { font-family: Arial, sans-serif; font-size: 9px; font-weight: 800; letter-spacing: .13em; white-space: nowrap; }
footer p { margin: 0; font-size: 9px; text-align: right; line-height: 1.6; }

.manage-link { padding: 9px 13px; border: 1px solid var(--line); border-radius: 10px; }
.edition-link { padding: 9px 13px; border-radius: 10px; background: var(--green-soft); color: var(--green-deep); text-decoration: none; white-space: nowrap; }
.lock-link { color: #7b8580; }
.access-page { min-height: 100vh; padding: 28px; display: grid; place-items: center; background: radial-gradient(circle at 20% 15%, #edf5ef, transparent 34%), radial-gradient(circle at 85% 82%, #f9e9df, transparent 33%), var(--paper); }
.access-card { width: min(610px, 100%); padding: 52px; border: 1px solid var(--line); border-radius: 30px; background: rgba(255,254,250,.96); box-shadow: 0 28px 80px rgba(18,49,36,.13); }
.access-lens { width: 64px; height: 64px; display: grid; place-items: center; margin-bottom: 28px; border: 8px solid #bec8c2; border-radius: 50%; background: #18231f; box-shadow: inset 0 0 0 6px #34443d; }
.access-lens span { width: 24px; height: 24px; border-radius: 50%; background: radial-gradient(circle at 34% 28%, #8bb9a8, #245a46 42%, #07100d 75%); }
.access-card h1 { margin: 0; font-size: clamp(36px, 6vw, 55px); letter-spacing: -.055em; }
.access-card > p:not(.kicker) { margin: 17px 0 29px; color: var(--muted); font-size: 13px; line-height: 1.9; }
.access-card form > label { display: block; margin-bottom: 8px; color: #4f5b55; font-size: 11px; font-weight: 800; }
.access-card form > div { display: grid; grid-template-columns: 1fr auto; gap: 10px; }
.access-card input { min-width: 0; height: 54px; padding: 0 15px; border: 1px solid var(--line); border-radius: 14px; outline: 0; background: white; font-size: 16px; font-weight: 750; letter-spacing: .14em; text-transform: uppercase; }
.access-card input:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(31,101,77,.1); }
.access-card .primary-button { min-width: 160px; }
.access-card .access-error { margin: 11px 0 0; color: #a54f3c; font-size: 11px; }
.access-card > small { display: block; margin-top: 18px; color: #8b928e; font-size: 10px; }
.access-checking { display: flex; align-items: center; gap: 12px; margin-top: 25px; color: var(--muted); }
.access-checking span { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--green-soft); color: var(--green); animation: sync-spin 1.4s linear infinite; }
.access-checking p { margin: 0; font-size: 12px; }
.manager-page { padding: 56px 0 90px; }
.admin-gate-wrap { min-height: calc(100vh - 170px); display: grid; place-items: center; }
.admin-gate { width: min(610px, 100%); padding: 48px; border: 1px solid var(--line); border-radius: 28px; background: var(--card); box-shadow: var(--shadow); }
.admin-lock { width: 46px; height: 46px; display: grid; place-items: center; margin-bottom: 24px; border: 2px solid var(--green); border-radius: 50%; color: var(--orange); font-size: 11px; box-shadow: inset 0 0 0 8px var(--green-soft); }

    }).join("");
    return '<div class="manager-page page-wrap"><div class="manager-heading"><div><p class="kicker"><span></span> PRODUCT MANAGER</p><h1>' + (sony ? 'SONY・Canon商品管理' : '商品データ管理') + '</h1><p>追加・修正した内容は、このHTMLを開いている端末・ブラウザに保存されます。</p></div><button class="primary-button add-product-button" data-action="add-product">＋ 商品を追加</button></div>' +
      '<section class="storage-notice"><span class="storage-icon" aria-hidden="true">✓</span><div><strong>この端末に保存済み</strong><p>別の端末へ移すときはデータを書き出し、移動先で読み込んでください。</p></div><div class="storage-actions"><button class="outline-button" data-action="export">データを書き出す</button><label class="outline-button file-button">データを読み込む<input id="import-file" type="file" accept="application/json,.json"></label></div></section>' +
      '<div class="manager-toolbar"><label class="search-box"><span>⌕</span><input id="manager-search" value="' + esc(state.search) + '" placeholder="メーカー・機種名で検索"></label><p><b>' + list.length + '</b> / ' + visibleProducts().length + ' 機種</p></div>' +
      '<section class="product-list">' + (rows || '<div class="empty-products"><strong>該当する商品がありません</strong><p>検索条件を変えるか、新しい商品を追加してください。</p></div>') + '</section>' +
      '<section class="view-key-settings"><div><p class="kicker"><span></span> ACCESS SETTING</p><h2>閲覧用の合言葉を変更</h2><p>新しい合言葉は全メーカー版とSONY・Canon版に共通で適用されます。共有相手には閲覧用だけを伝えてください。</p></div><form id="view-key-form"><label for="new-view-key">新しい合言葉</label><div><input id="new-view-key" name="newViewKey" placeholder="6〜32文字の半角英数字" autocapitalize="characters"><button class="primary-button" type="submit">変更する</button></div>' +
      (state.viewKeyMessage ? '<p class="view-key-message" role="status">' + esc(state.viewKeyMessage) + '</p>' : '') +
      '</form></section>' +
      '<div class="manager-bottom"><p>' + (sony ? '専用版：SONY・Canon ' + visibleProducts().length + '機種' : '初期データ：2026年8月の売れ筋・注目機を中心に主要7社・' + products.length + '機種') + '</p><div><button class="reset-button neutral" data-action="forget-admin">この端末の管理コードを消す</button><button class="reset-button" data-action="reset">初期データに戻す</button></div></div></div>';
  }
  function checkboxGroup(name, items, selected) {
    return '<div class="tag-checks">' + items.map(function (item) { var checked = selected.indexOf(item.id) >= 0; return '<label class="' + (checked ? 'checked' : '') + '"><input type="checkbox" name="' + name + '" value="' + esc(item.id) + '" ' + (checked ? 'checked' : '') + '>' + esc(item.label) + '</label>'; }).join('') + '</div>';
  }
  function renderEditor() {
    if (state.editorId === null) return '';
    var existing = products.find(function (p) { return p.id === state.editorId; });
    var p = existing ? clone(existing) : {
      id: 'custom-' + Date.now(), brand: state.mode === 'sony-canon' ? 'SONY' : '', model: '', tagline: '', sensor: 'APS-C', style: 'hybrid', budget: 2, priceLabel: '', subjects: [], levels: ['first','grow'], priorities: [], strengths: ['', '', ''], cautions: [''], officialUrl: ''
    };
    function options(values, selected) { return values.map(function (v) { return '<option ' + (v === selected ? 'selected' : '') + '>' + esc(v) + '</option>'; }).join(''); }
    function budgetOptions(selected) { return [1,2,3,4].map(function (v) { return '<option value="' + v + '" ' + (v === Number(selected) ? 'selected' : '') + '>' + esc(BUDGET_LABELS[v]) + '</option>'; }).join(''); }
    return '<div class="editor-backdrop"><section class="editor-panel" role="dialog" aria-modal="true"><div class="editor-header"><div><p>PRODUCT DATA</p><h2>' + (existing ? '商品情報を編集' : '商品を追加') + '</h2></div><button class="close-button" data-action="close-editor">×</button></div><form id="product-form"><input type="hidden" name="id" value="' + esc(p.id) + '"><div class="form-section"><h3>基本情報</h3><div class="form-grid two-columns"><label><span>メーカー</span><input required name="brand" value="' + esc(p.brand) + '" placeholder="SONY"></label><label><span>機種名</span><input required name="model" value="' + esc(p.model) + '" placeholder="α6700"></label></div><label><span>ひとことで表すと</span><input required name="tagline" value="' + esc(p.tagline) + '"></label><div class="form-grid three-columns"><label><span>センサー</span><select name="sensor">' + options(['1.0型','1.4型','マイクロフォーサーズ','APS-C','フルサイズ','中判'], p.sensor) + '</select></label><label><span>向いている使い方</span><select name="style"><option value="photo" ' + (p.style === 'photo' ? 'selected' : '') + '>写真重視</option><option value="hybrid" ' + (p.style === 'hybrid' ? 'selected' : '') + '>写真・動画</option><option value="video" ' + (p.style === 'video' ? 'selected' : '') + '>動画重視</option></select></label><label><span>価格帯</span><select name="budget">' + budgetOptions(p.budget) + '</select></label></div><div class="form-grid two-columns"><label><span>売場価格（任意）</span><input name="priceLabel" value="' + esc(p.priceLabel || '') + '"></label><label><span>公式ページURL（任意）</span><input type="url" name="officialUrl" value="' + esc(p.officialUrl || '') + '"></label></div></div>' +
      '<div class="form-section"><h3>判定に使うタグ</h3><fieldset><legend>撮影シーン</legend>' + checkboxGroup('subjects', SUBJECTS, p.subjects || []) + '</fieldset><fieldset><legend>使う人</legend>' + checkboxGroup('levels', LEVELS, p.levels || []) + '</fieldset><fieldset><legend>強いポイント</legend>' + checkboxGroup('priorities', PRIORITIES, p.priorities || []) + '</fieldset></div>' +
      '<div class="form-section"><h3>ご案内に表示する内容</h3><label><span>おすすめ理由（1行につき1つ）</span><textarea rows="5" required name="strengths">' + esc((p.strengths || []).join('\n')) + '</textarea></label><label><span>一緒に確認したい点（1行につき1つ）</span><textarea rows="3" name="cautions">' + esc((p.cautions || []).join('\n')) + '</textarea></label><p class="required-note">保存後、この端末の診断へすぐ反映されます。</p></div><div class="editor-actions"><button type="button" class="outline-button" data-action="close-editor">キャンセル</button><button class="primary-button" type="submit">保存する <span>→</span></button></div></form></section></div>';
  }
  function render() {
    if (!state.accessUnlocked) {
      root.innerHTML = renderAccess() + '<div id="toast" class="toast" role="status"></div>';
      return;
    }
    var content = state.view === 'welcome' ? renderWelcome() : state.view === 'consult' ? renderConsult() : state.view === 'results' ? renderResults() : renderManager();
    root.innerHTML = '<main class="app-shell">' + headerHtml() + content + footerHtml() + renderEditor() + '</main><div id="toast" class="toast" role="status"></div>';
    var search = document.getElementById('manager-search');
    if (search) { search.focus(); search.setSelectionRange(search.value.length, search.value.length); }
  }
  function toast(message) {
    var el = document.getElementById('toast');
    if (!el) return;
    el.textContent = message;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 1800);
  }
  function goTop() { try { window.scrollTo({ top: 0, behavior: 'smooth' }); } catch (_) { window.scrollTo(0, 0); } }
  function startConsult() { state.answers = { priorities: [] }; state.step = 0; state.featuredId = ''; state.view = 'consult'; render(); goTop(); }
  function downloadJson() {
    var blob = new Blob([JSON.stringify(products, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'camera-products-' + new Date().toISOString().slice(0, 10) + '.json'; a.click();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    toast('JSONを書き出しました');
  }
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
    var area = document.createElement('textarea'); area.value = text; document.body.appendChild(area); area.select(); document.execCommand('copy'); area.remove(); return Promise.resolve();
  }
  function validProducts(value) {
    return Array.isArray(value) && value.length > 0 && value.every(function (p) { return p && p.id && p.brand && p.model && Array.isArray(p.subjects) && Array.isArray(p.levels) && Array.isArray(p.priorities) && Array.isArray(p.strengths); });
  }

  document.addEventListener('click', function (event) {
    var target = event.target.closest('[data-action],[data-answer],[data-feature],[data-edit],[data-delete]');
    if (!target) return;
    if (target.dataset.answer) {
      var q = questions()[state.step];
      var id = target.dataset.answer;
      if (q.key === 'priorities') {
        var idx = state.answers.priorities.indexOf(id);
        if (idx >= 0) state.answers.priorities.splice(idx, 1);
        else if (state.answers.priorities.length < 2) state.answers.priorities.push(id);
      } else state.answers[q.key] = id;
      render(); return;
    }
    if (target.dataset.feature) { state.featuredId = target.dataset.feature; render(); goTop(); return; }
    if (target.dataset.edit) { state.editorId = target.dataset.edit; render(); return; }
    if (target.dataset.delete) {
      var p = products.find(function (item) { return item.id === target.dataset.delete; });
      if (p && confirm(p.brand + ' ' + p.model + ' をこの端末の商品データから削除しますか？')) { products = products.filter(function (item) { return item.id !== p.id; }); saveProducts('削除して保存しました'); render(); }
      return;
    }
    switch (target.dataset.action) {
      case 'home': state.view = 'welcome'; state.editorId = null; render(); goTop(); break;
      case 'manage': state.view = 'manage'; state.editorId = null; render(); goTop(); break;
      case 'toggle-edition': state.mode = state.mode === 'sony-canon' ? 'all' : 'sony-canon'; safeSet(MODE_KEY, state.mode); state.view = 'welcome'; state.featuredId = ''; render(); goTop(); break;
      case 'lock': safeRemove(ACCESS_KEY); safeRemove(ADMIN_ACCESS_KEY); state.accessUnlocked = false; state.adminUnlocked = false; state.view = 'welcome'; state.editorId = null; state.accessError = ''; state.adminError = ''; render(); goTop(); break;
      case 'start': startConsult(); break;
      case 'back': if (state.step > 0) state.step -= 1; else state.view = 'welcome'; render(); goTop(); break;
      case 'next':
        if (state.step < 3) { state.step += 1; render(); goTop(); }
        else { var ranked = scoreProducts(visibleProducts(), state.answers); state.featuredId = ranked[0] ? ranked[0].product.id : ''; state.view = 'results'; render(); goTop(); }
        break;
      case 'revise': state.view = 'consult'; state.step = 0; render(); goTop(); break;
      case 'copy-talk':
        var ranked2 = scoreProducts(visibleProducts(), state.answers); var item = ranked2.find(function (r) { return r.product.id === state.featuredId; }) || ranked2[0];
        if (item) copyText(buildTalk(item.product, state.answers)).then(function () { toast('案内文をコピーしました'); });
        break;
      case 'add-product': state.editorId = ''; render(); break;
      case 'close-editor': state.editorId = null; render(); break;
      case 'export': downloadJson(); break;
      case 'forget-admin': safeRemove(ADMIN_ACCESS_KEY); state.adminUnlocked = false; state.adminError = ''; state.editorId = null; render(); goTop(); break;
      case 'reset': if (confirm('この端末の商品データを初期41機種へ戻しますか？')) { products = clone(DEFAULT_PRODUCTS); saveProducts('初期データへ戻しました'); render(); } break;
    }
  });

  document.addEventListener('input', function (event) {
    if (event.target.id === 'manager-search') { state.search = event.target.value; var pos = event.target.selectionStart; render(); var input = document.getElementById('manager-search'); if (input) input.setSelectionRange(pos, pos); }
  });

  document.addEventListener('change', function (event) {
    if (event.target.matches('.tag-checks input')) event.target.closest('label').classList.toggle('checked', event.target.checked);
    if (event.target.id === 'import-file') {
      var file = event.target.files && event.target.files[0];
      event.target.value = '';
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        try {
          var imported = JSON.parse(String(reader.result));
          if (!validProducts(imported)) throw new Error('invalid');
          if (confirm(imported.length + '機種のデータに置き換えますか？')) { products = imported; saveProducts('JSONを読み込みました'); render(); }
        } catch (_) { alert('読み込めないファイルです。この画面から書き出したJSONを選んでください。'); }
      };
      reader.readAsText(file);
    }
  });

  document.addEventListener('submit', function (event) {
    if (event.target.id === 'access-form') {
      event.preventDefault();
      var accessData = new FormData(event.target);
      var accessCode = String(accessData.get('viewCode') || '').trim().toUpperCase();
      var expectedCode = safeGet(VIEW_CODE_KEY) || DEFAULT_VIEW_CODE;
      if (accessCode === expectedCode) {
        safeSet(ACCESS_KEY, '1');
        state.accessUnlocked = true;
        state.accessError = '';
        render();
        goTop();
      } else {
        state.accessError = '合言葉を確認してください。';
        render();
      }
      return;
    }
    if (event.target.id === 'admin-form') {
      event.preventDefault();
      var adminData = new FormData(event.target);
      var adminCode = String(adminData.get('adminCode') || '').trim();
      if (adminCode === DEFAULT_ADMIN_CODE) {
        safeSet(ADMIN_ACCESS_KEY, '1');
        state.adminUnlocked = true;
        state.adminError = '';
        render();
        goTop();
      } else {
        state.adminError = '管理コードを確認してください。';
        render();
      }
      return;
    }
    if (event.target.id === 'view-key-form') {
      event.preventDefault();
      var viewKeyData = new FormData(event.target);
      var nextKey = String(viewKeyData.get('newViewKey') || '').trim().toUpperCase();
      if (!/^[A-Z0-9_-]{6,32}$/.test(nextKey)) {
        state.viewKeyMessage = '6〜32文字の半角英数字・ハイフン・アンダーバーで入力してください。';
      } else {
        safeSet(VIEW_CODE_KEY, nextKey);
        state.viewKeyMessage = '閲覧用の合言葉を変更しました。この端末で次回ロック解除するときから新しい合言葉が必要です。';
      }
      render();
      return;
    }
    if (event.target.id !== 'product-form') return;
    event.preventDefault();
    var fd = new FormData(event.target);
    var product = {
      id: String(fd.get('id')), brand: String(fd.get('brand')).trim(), model: String(fd.get('model')).trim(), tagline: String(fd.get('tagline')).trim(),
      sensor: String(fd.get('sensor')), style: String(fd.get('style')), budget: Number(fd.get('budget')), priceLabel: String(fd.get('priceLabel') || '').trim(),
      subjects: fd.getAll('subjects').map(String), levels: fd.getAll('levels').map(String), priorities: fd.getAll('priorities').map(String),
      strengths: String(fd.get('strengths')).split(/\r?\n/).map(function (s) { return s.trim(); }).filter(Boolean),
      cautions: String(fd.get('cautions') || '').split(/\r?\n/).map(function (s) { return s.trim(); }).filter(Boolean), officialUrl: String(fd.get('officialUrl') || '').trim()
    };
    var index = products.findIndex(function (p) { return p.id === product.id; });
    if (index >= 0) products[index] = product; else products.push(product);
    state.editorId = null; saveProducts(index >= 0 ? '変更を保存しました' : '商品を追加しました'); render();
  });

  window.CAMERA_CONSULT_OFFLINE = {
    version: 6,
    defaults: { viewCode: DEFAULT_VIEW_CODE, adminCode: DEFAULT_ADMIN_CODE },
    getProducts: function () { return clone(products); },
    score: function (answers, mode) { var list = mode === 'sony-canon' ? products.filter(function (p) { return p.brand === 'SONY' || p.brand === 'Canon'; }) : products; return scoreProducts(list, answers); }
  };
  render();
})();
</script>
</body>
</html>
